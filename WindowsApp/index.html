<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hangly</title>
  <style>
    /* ── Reset ───────────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    }

    /* ── Canvas ──────────────────────────────────────────────────── */
    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── Anchor drag handle (invisible but interactive) ──────────── */
    #anchorHandle {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      height: 28px;
      cursor: grab;
      z-index: 50;
    }
    #anchorHandle:active {
      cursor: grabbing;
    }

    /* ── Picker pill ─────────────────────────────────────────────── */
    .picker-container {
      position: absolute;
      top: 10px;
      right: 12px;
      z-index: 100;
      display: flex;
      gap: 5px;
      align-items: center;

      /* Windows 11 Mica-inspired glass pill */
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 24px;
      padding: 5px 11px;
      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.10),
        0 1px 2px rgba(0, 0, 0, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.85);
      transition: opacity 0.2s ease, transform 0.18s ease, box-shadow 0.18s ease;
      opacity: 0.82;
    }

    .picker-container:hover {
      opacity: 1;
      transform: translateY(-1px) scale(1.015);
      box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.13),
        0 2px 4px rgba(0, 0, 0, 0.07),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    /* Dark mode adaptation */
    @media (prefers-color-scheme: dark) {
      .picker-container {
        background: rgba(32, 32, 35, 0.82);
        border-color: rgba(255, 255, 255, 0.12);
        box-shadow:
          0 2px 8px rgba(0, 0, 0, 0.40),
          0 1px 2px rgba(0, 0, 0, 0.25),
          inset 0 1px 0 rgba(255, 255, 255, 0.07);
      }
      .picker-container:hover {
        box-shadow:
          0 6px 18px rgba(0, 0, 0, 0.50),
          0 2px 4px rgba(0, 0, 0, 0.30),
          inset 0 1px 0 rgba(255, 255, 255, 0.09);
      }
      select { color: #e8e8ea; }
      .btn-icon { color: #c0bec6; }
    }

    select {
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      border: none;
      font-size: 12.5px;
      font-weight: 500;
      color: #1c1c1e;
      outline: none;
      cursor: pointer;
      padding: 2px 2px 2px 3px;
      letter-spacing: 0.01em;
      max-width: 128px;
    }

    select option {
      background: #ffffff;
      color: #1c1c1e;
    }

    @media (prefers-color-scheme: dark) {
      select option {
        background: #2c2c2e;
        color: #e8e8ea;
      }
    }

    .btn-icon {
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      color: #48484a;
      font-size: 16px;
      font-weight: 400;
      line-height: 1;
      transition: background 0.13s, transform 0.1s;
      flex-shrink: 0;
    }

    .btn-icon:hover {
      background: rgba(0, 0, 0, 0.09);
      transform: scale(1.15);
    }

    .btn-icon:active {
      transform: scale(0.92);
    }

    /* Divider between select and button */
    .pill-divider {
      width: 1px;
      height: 14px;
      background: rgba(0, 0, 0, 0.12);
      flex-shrink: 0;
    }

    @media (prefers-color-scheme: dark) {
      .pill-divider { background: rgba(255, 255, 255, 0.14); }
    }

    /* Hidden file input */
    #fileInput { display: none; }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <!-- Invisible anchor drag zone -->
  <div id="anchorHandle" title="Drag to move Hangly"></div>

  <!-- Charm picker pill -->
  <div class="picker-container" id="pickerContainer">
    <select id="charmSelect" title="Choose a charm">
      <option value="Nazar Boncuğu.svg">Nazar Boncuğu</option>
      <option value="Daruma.svg">Daruma</option>
      <option value="Hamsa.svg">Hamsa</option>
      <option value="Maneki-neko.svg">Maneki-neko</option>
      <option value="Ghanta.svg">Ghanta</option>
      <option value="Horseshoe.svg">Horseshoe</option>
      <option value="Scarab.svg">Scarab</option>
      <option value="Himmeli.svg">Himmeli</option>
      <option value="Dhrishti bomma.svg">Dhrishti Bomma</option>
      <option value="Nimbu-mirchi.svg">Nimbu Mirchi</option>
      <option value="Pánchang Jié.svg">Pánchang Jié</option>
      <option value="Emoji.svg">Emoji</option>
    </select>
    <div class="pill-divider"></div>
    <button class="btn-icon" id="addSvgBtn" title="Upload custom charm">+</button>
    <input type="file" id="fileInput" accept=".svg,.png,.jpg,.jpeg,.webp">
  </div>

  <script src="renderer.js"></script>
</body>
</html>
