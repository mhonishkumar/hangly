<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hangly</title>
  <style>
    body {
      margin: 0;
      width: 200px;
      padding: 16px;
      font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      color: #1c1c1e;
      text-align: center;
      border-radius: 12px;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: linear-gradient(135deg, #0f2027 0%, #2c5364 100%);
        color: #e8e8ea;
      }
    }
    .logo { font-size: 36px; margin-bottom: 6px; }
    h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
    p { font-size: 12px; opacity: 0.7; margin: 0; }
  </style>
</head>
<body>
  <div class="logo">🧿</div>
  <h1>Hangly</h1>
  <p>Your charm is hanging on every tab!</p>
</body>
</html>
